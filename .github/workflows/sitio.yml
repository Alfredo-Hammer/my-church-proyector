# Publica la página web (carpeta sitio/) en GitHub Pages → https://gloryview.app
# Se ejecuta sola cuando cambia algo en sitio/ en master, o a mano desde la pestaña Actions.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions" y dominio gloryview.app.
name: Publicar sitio web

on:
  push:
    branches: [master]
    paths: ["sitio/**", ".github/workflows/sitio.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deployment
        uses: actions/deploy-pages@v4
