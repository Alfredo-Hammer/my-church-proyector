name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej: v0.2.9)'
        required: true
        default: 'v0.2.9'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar React (UI)
        run: npm run build
        env:
          CI: false

      - name: Leer notas de versión desde NOVEDADES.txt
        id: novedades
        run: |
          if (Test-Path "NOVEDADES.txt") {
            $notes = Get-Content "NOVEDADES.txt" -Raw -Encoding UTF8
          } else {
            $notes = "Correcciones y mejoras generales"
          }
          # Guardar como output multilinea
          "NOTES<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        shell: pwsh

      - name: Compilar instalador Windows (con notas en latest.yml)
        run: |
          $notes = Get-Content "NOVEDADES.txt" -Raw -Encoding UTF8
          # Pasar las notas a electron-builder para que las incluya en latest.yml
          # El updater lee latest.yml directamente -> texto plano sin HTML
          npx electron-builder --win nsis --x64 `
            --config.releaseInfo.releaseNotes="$notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: Obtener versión
        id: get_version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.version }}" | ForEach-Object { "VERSION=$_" } | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $tag = "${{ github.ref }}" -replace "refs/tags/", ""
            "VERSION=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
        shell: pwsh

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: GloryView ${{ steps.get_version.outputs.VERSION }}
          body: |
            GloryView ${{ steps.get_version.outputs.VERSION }}

            Novedades
            ${{ steps.novedades.outputs.NOTES }}

            ---

            Instalacion
            1. Descarga el archivo GloryView-Installer.exe
            2. Ejecuta el instalador como Administrador (clic derecho, Ejecutar como administrador)
            3. Sigue el asistente de instalacion
            4. Abre GloryView desde el escritorio o el menu inicio

            Requisitos
            - Windows 10/11 (64-bit)
            - Visual C++ Redistributable 2015-2022

            Configuracion del Firewall
            GloryView usa el puerto 3001 para comunicacion interna.
            En la primera ejecucion acepta el mensaje del Firewall de Windows.
            Si lo bloqueo: Configuracion de Windows, Firewall, Permitir una app, busca GloryView y activa Red privada y Red publica.

            Solucion de problemas
            - Si no abre: clic derecho, Ejecutar como administrador
            - Revisa logs en: %APPDATA%\GloryView\gloryview-error.log
          draft: false
          prerelease: false
          files: |
            dist-installer/*.exe
            dist-installer/*.blockmap
            dist-installer/latest.yml
            INSTRUCCIONES-WINDOWS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
